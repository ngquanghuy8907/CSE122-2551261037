<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốn Mùa</title>
</head>
<body>
    <article>

        <h1>BỐN MÙA</h1>

        <p>
            Xuân về trăm hoa đua nở<br>
            Chim ca ríu rít gọi mời<br>
            Đất trời bừng sáng niềm vui
        </p>
        <hr>
        <p>
            Hạ sang nắng trải vàng sân<br>
            Tiếng ve ngân khúc trong ngần<br>
            Cánh diều bay giữa trời xanh
        </p>
        <hr>
        <p>
            Thu về lá nhẹ rung rinh<br>
            Đông sang gió lạnh yên bình<br>
            Bốn mùa đẹp mãi quê mình
        </p>

    </article>
</body>
</html>
